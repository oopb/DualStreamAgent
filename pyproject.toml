[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualstream-agent"
version = "0.2.0"
description = "A local-first real-time dual-system multimodal agent framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DualStreamAgent contributors"}]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
transformers = [
    "torch>=2.2",
    "transformers>=4.56",
    "accelerate>=0.34",
]
video = ["opencv-python-headless>=4.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
all = [
    "torch>=2.2",
    "transformers>=4.56",
    "accelerate>=0.34",
    "opencv-python-headless>=4.9",
]

[project.scripts]
dualstream = "dualstream_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualstream-agent"
version = "0.1.0"
description = "A local-first real-time dual-system multimodal agent framework"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
